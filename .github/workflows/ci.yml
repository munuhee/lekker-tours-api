name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lekker_tours_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lekker_tours_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lekker_tours_ci?schema=public
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      JWT_SECRET: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No test suite yet; these catch syntax errors and unresolved imports,
      # which is what most often breaks this service.
      - name: Syntax check all sources
        run: git ls-files '*.js' | xargs -n1 node --check

      - name: Validate the Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Boot the app against PostgreSQL
        run: |
          node -e "
            import('./src/app.js')
              .then((m) => { m.createApp(); console.log('createApp() OK'); })
              .catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Seed, then verify the API answers
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CiPassword123!
        run: |
          npm run seed:admin
          npm run seed
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/tours > /dev/null; then
              echo "API responded"; exit 0
            fi
            sleep 1
          done
          echo "API did not respond in time"; exit 1
